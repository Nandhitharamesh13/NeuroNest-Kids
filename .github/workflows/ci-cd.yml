name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Test Backend
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install Backend Dependencies
        working-directory: neuro-frontend/neuronest-kids/backend
        run: npm install
      
      - name: Run Linter
        working-directory: neuro-frontend/neuronest-kids/backend
        run: npm run lint --if-present || echo "No lint script"
      
      - name: Check Syntax
        working-directory: neuro-frontend/neuronest-kids/backend
        run: node -c server.js

  # Job 2: Test Frontend
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install Frontend Dependencies
        working-directory: neuro-frontend/neuronest-kids
        run: npm install
      
      - name: Build Frontend
        working-directory: neuro-frontend/neuronest-kids
        run: npm run build
      
      - name: Run Linter
        working-directory: neuro-frontend/neuronest-kids
        run: npm run lint --if-present || echo "No lint script"

  # Job 3: Build Docker Images (on main push)
  build-docker:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Backend Docker Image
        run: |
          docker build -t neuronest-backend:latest neuro-frontend/neuronest-kids/backend
          echo "Docker backend build successful!"
      
      - name: Build Frontend Docker Image
        run: |
          docker build -t neuronest-frontend:latest neuro-frontend/neuronest-kids
          echo "Docker frontend build successful!"

  # Job 4: Security Scan (optional)
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Run npm audit
        working-directory: neuro-frontend/neuronest-kids/backend
        run: npm audit --audit-level=moderate || echo "Vulnerabilities found, review them"

on-success:
  if: always()
  name: Notify Success
  runs-on: ubuntu-latest
  needs: [test-backend, test-frontend]
  steps:
    - name: All tests passed!
      run: echo "✅ CI/CD Pipeline completed successfully!"
