version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: neuronest-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-neuronest_admin}
      POSTGRES_PASSWORD: ${DB_PASS:-root12}
      POSTGRES_DB: ${DB_NAME:-neuronest}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./neuro-frontend/neuronest-kids/backend/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-neuronest_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: neuronest-backend
    ports:
      - "${PORT:-5000}:5000"
    environment:
      DB_USER: ${DB_USER:-neuronest_admin}
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-neuronest}
      DB_PASS: ${DB_PASS:-root12}
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:-neuronest_jwt_super_secret_2024_pravin}
      NODE_ENV: ${NODE_ENV:-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend with Nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: neuronest-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
